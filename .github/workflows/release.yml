name: Release

# Pushing a tag like v0.2.0 tests, builds and publishes a GitHub release with:
#   - catd plus the official plugins, one archive per platform
#   - the desktop app: Cat.dmg & .zip for macOS, .deb / .rpm / .AppImage /
#     .tar.gz for Linux, a setup .exe & portable .zip for Windows
#   - update.json, which running copies read to update themselves
#
# Running it by hand (workflow_dispatch) builds everything and keeps it as
# workflow artifacts, without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2

      - name: Build the web UI
        run: make frontend

      - name: Package catd
        run: python3 scripts/build-release.py "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          if-no-files-found: error
          path: dist/release/*

  # The desktop shell is built natively: it needs each platform's webview.
  desktop-app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2

      - name: Install Linux webview libraries and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev rpm desktop-file-utils file
          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$(uname -m).AppImage" \
            -o /tmp/appimagetool
          sudo install -m 755 /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: |
          if [ ! -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] && ! command -v iscc >/dev/null 2>&1; then
            choco install -y innosetup --no-progress
          fi

      - name: Build the app
        run: |
          # Tags are v1.2.3; a manual run on a branch keeps the default.
          case "$GITHUB_REF_NAME" in v[0-9]*) export CAT_VERSION="${GITHUB_REF_NAME#v}" ;; esac
          make app

      - name: Archive the app
        run: |
          name="Cat-${GITHUB_REF_NAME//\//-}-$(go env GOOS | sed s/darwin/macos/)-$(go env GOARCH)"
          cd bin
          case "$RUNNER_OS" in
            # ditto keeps the bundle's signature and symlinks intact.
            macOS)
              ditto -c -k --keepParent Cat.app "../$name.zip"
              mv Cat.dmg "../$name.dmg" ;;
            Linux)
              mv Cat-linux Cat && tar -czf "../$name.tar.gz" Cat
              mv cat_*.deb "../$name.deb"
              mv cat_*.rpm "../$name.rpm"
              mv Cat.AppImage "../$name.AppImage" ;;
            Windows)
              mv Cat-windows Cat && 7z a -tzip "../$name.zip" Cat
              mv Cat-setup.exe "../$name-setup.exe" ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            Cat-*.zip
            Cat-*.dmg
            Cat-*.exe
            Cat-*.tar.gz
            Cat-*.deb
            Cat-*.rpm
            Cat-*.AppImage

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, packages, desktop-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      # Only the script is needed from the repository.
      - uses: actions/checkout@v7
        with:
          path: source
          sparse-checkout: scripts
      # Running copies read this from releases/latest/download/update.json.
      - name: Write the update manifest
        run: python3 source/scripts/build-update.py "$GITHUB_REF_NAME" "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}" assets
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find assets -type f | sort
          # GitHub release asset names collide case-insensitively and fail with 404.
          dupes=$(find assets -type f -exec basename {} \; | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "duplicate release asset names (case-insensitive):" >&2
            echo "$dupes" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            $(find assets -type f)
