name: Release

# Pushing a tag like v0.2.0 tests, builds and publishes a GitHub release with:
#   - catd plus the official plugins, one archive per platform
#   - the desktop app: Cat.app for macOS, a tarball and a .deb for Linux, a zip
#     for Windows
#   - the plugin market: one zip per plugin and platform, and index.json
#
# Running it by hand (workflow_dispatch) builds everything and keeps it as
# workflow artifacts, without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2

      - name: Build the web UI
        run: make frontend

      # The index points at this release's own assets, so a published index
      # keeps working after later releases.
      - name: Build the plugin market
        run: python3 scripts/build-market.py "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}"

      - name: Package catd
        run: python3 scripts/build-release.py "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          if-no-files-found: error
          path: |
            dist/release/*
            dist/market/*.zip
            dist/market/index.json

  # The desktop shell is built natively: it needs each platform's webview.
  desktop-app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2

      - name: Install the Linux webview libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build the app
        run: |
          # Tags are v1.2.3; a manual run on a branch keeps the default.
          case "$GITHUB_REF_NAME" in v[0-9]*) export CAT_VERSION="${GITHUB_REF_NAME#v}" ;; esac
          make app

      - name: Archive the app
        run: |
          name="Cat-${GITHUB_REF_NAME//\//-}-$(go env GOOS | sed s/darwin/macos/)-$(go env GOARCH)"
          cd bin
          case "$RUNNER_OS" in
            # ditto keeps the bundle's signature and symlinks intact.
            macOS) ditto -c -k --keepParent Cat.app "../$name.zip" ;;
            Linux)
              mv Cat-linux Cat && tar -czf "../$name.tar.gz" Cat
              mv cat_*.deb "../$name.deb" ;;
            Windows) mv Cat-windows Cat && 7z a -tzip "../$name.zip" Cat ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            Cat-*.zip
            Cat-*.tar.gz
            Cat-*.deb

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, packages, desktop-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find assets -type f | sort
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            $(find assets -type f)
