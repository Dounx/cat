name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the release workflow run the same checks before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2

      # First, so a formatting slip fails in seconds rather than after the
      # builds. Prettier comes from the frontend's dev dependencies.
      - name: Check formatting
        run: |
          (cd frontend && pnpm install --frozen-lockfile)
          make fmt-check

      # vue-tsc type-checks the UI as part of the build.
      - name: Build the web UI
        run: make frontend

      - name: Test the web UI
        run: cd frontend && pnpm test

      - name: Install TypeScript dependencies
        run: |
          cd sdk/node && pnpm install --frozen-lockfile
          cd ../../plugins/discord && bun install

      # Builds every plugin and catd, so a plugin that no longer compiles
      # fails here rather than at release time.
      - name: Build plugins and catd
        run: make plugins catd

      - name: Go tests
        run: |
          go vet ./...
          go test ./...
          cd sdk/go && go vet ./... && go test ./...

      - name: Type-check the Node SDK and the Discord plugin
        run: |
          cd sdk/node && npx tsc -p .
          cd ../../plugins/discord && npx tsc -p .

  # The desktop shell needs each platform's webview (and CGO everywhere but
  # Windows), so it is checked on every platform it ships for.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Install the Linux webview libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Vet and build the desktop shell
        run: |
          cd desktop
          go vet ./...
          go build -o "$RUNNER_TEMP/cat-desktop" .
