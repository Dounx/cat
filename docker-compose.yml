services:
  cat:
    build:
      context: .
      dockerfile: Dockerfile
    image: cat:local
    container_name: cat
    restart: unless-stopped
    ports:
      - "7788:7788"
    environment:
      # Required when listening on 0.0.0.0: replace with a strong random token.
      CAT_TOKEN: ${CAT_TOKEN:-change-me-strong-token}
      # Optional: encrypts /data/secrets.json with AES-256-GCM when set.
      CAT_MASTER_KEY: ${CAT_MASTER_KEY:-}
      # Optional operational limits (defaults shown).
      CAT_KEEP_EVENTS: ${CAT_KEEP_EVENTS:-20000}
      CAT_MAX_CONCURRENT: ${CAT_MAX_CONCURRENT:-16}
      CAT_SERIALIZE_CONVERSATIONS: ${CAT_SERIALIZE_CONVERSATIONS:-true}
      # Timezone for schedule triggers and log timestamps.
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7788/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
